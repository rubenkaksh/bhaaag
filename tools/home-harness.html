<!doctype html>
<html><head><meta charset="utf-8"><title>nagarkot-home dressing harness</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Dev-only harness for T336b (not part of the build): builds nagarkot-home in a real scene so
// tools/home-measure.mjs can read draw calls and take screenshots. Level is not registered in modes.
import { createGameScene } from '/src/adapters/render/scene.ts';
import { loadWorldFromObject } from '/src/content/load.ts';
import { buildNagarkotHome } from '/src/content/strategy/home.ts';
import { dressNagarkotHome } from '/src/adapters/render/decor/homeDress.ts';
const s = buildNagarkotHome();
const d = dressNagarkotHome(s);
const wn = s.world ? s.world.nodes : s.nodes;
const world = loadWorldFromObject(s.level);
const gs = createGameScene(document.getElementById('c'));
const mode = new URLSearchParams(location.search).get('kit') === '0' ? 'plain' : 'kit';
gs.buildWorld(world, { houseDress: false, graph: mode === 'kit' ? d : { ...d, kitSkip: undefined } });
window.__h = {
  nodes: s.nodes.length, houses: d.houses.length, solids: world.solids.length,
  view(x, y, z, tx, ty, tz) {
    gs.camera.position.set(x, y, z);
    gs.camera.lookAt(tx, ty, tz);
    gs.camera.updateMatrixWorld();
    gs.resize();
    gs.render();
    gs.render();
    return gs.frameStats();
  },
  start: [world.spawn.x, world.spawn.y, world.spawn.z],
  goal: wn[s.graph.goal] ? [wn[s.graph.goal].x0, wn[s.graph.goal].y, wn[s.graph.goal].z0] : null,
  pivot: s.world ? [wn[s.world.pivotNode].x0, wn[s.world.pivotNode].y, s.world.zr] : null,
  nodeList: wn.map((n) => ({ k: n.kind, x0: n.x0, x1: n.x1, z0: n.z0, z1: n.z1, y: n.y })),
};
window.__ready = true;
</script></body></html>
