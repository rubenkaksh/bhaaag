<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Zipline Tole</title>
    <link rel="stylesheet" href="/src/adapters/ui/touch.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d3a5c;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      canvas#game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="stick-zone"></div>
    <div id="look-zone"></div>
    <button id="btn-action" type="button" aria-label="Hook" data-mode="hook">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="ic-hook" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9.5 19.5 4.5M17 2.5l4.5 4.5M14.5 9.5c-3 3-6 2-8 4.5a3 3 0 1 0 4 4c1.2-1.4.6-3.4-1-3.6"/></g>
        <g class="ic-brake" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8h12M6 12h12M8 16l4 3 4-3"/></g>
      </svg>
    </button>
    <button id="btn-jump" type="button" aria-label="Jump">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.6 6.4 9 7.6l-2.4 3.1 1.6 1.2 1.9-2.4 2-.5-1.6 4.4L7.4 17H3.5v2h5l2.6-2.6 2 1.9V23h2v-5.6l-2.4-2.3 1-3 1.4 1.8H20v-2h-3.9l-1.7-3.3c-.3-.6-.9-1-1.6-1z"/><circle fill="currentColor" cx="15.5" cy="3.5" r="2"/></svg>
    </button>
    <div id="rotate">Rotate your phone to landscape</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
