<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Bhaaag</title>
    <meta
      name="description"
      content="Fire a zipline hook and slide the Kathmandu rooftops at sunset. One hit and you fall; restart is instant. Free, plays in your browser."
    />
    <meta name="theme-color" content="#3b2a5c" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bhaaag" />
    <meta property="og:title" content="Bhaaag: slide the Kathmandu rooftops" />
    <meta
      property="og:description"
      content="Fire a zipline hook and slide house to house at sunset. One hit and you fall; restart is instant."
    />
    <meta property="og:url" content="https://rubenkaksh.github.io/bhaaag/" />
    <meta property="og:image" content="https://rubenkaksh.github.io/bhaaag/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A runner hanging from a zipline above Newari rooftops at sunset, with the title Bhaaag."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/debug.js"></script>
    <link rel="stylesheet" href="/src/adapters/ui/touch.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d3a5c;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      canvas#game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="stick-zone"></div>
    <div id="look-zone"></div>
    <button id="btn-jump" type="button" aria-label="Jump" data-mode="jump">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="ic-jump">
          <path
            fill="currentColor"
            d="M13.6 6.4 9 7.6l-2.4 3.1 1.6 1.2 1.9-2.4 2-.5-1.6 4.4L7.4 17H3.5v2h5l2.6-2.6 2 1.9V23h2v-5.6l-2.4-2.3 1-3 1.4 1.8H20v-2h-3.9l-1.7-3.3c-.3-.6-.9-1-1.6-1z"
          />
          <circle fill="currentColor" cx="15.5" cy="3.5" r="2" />
        </g>
        <g
          class="ic-hook"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14.5 9.5 19.5 4.5M17 2.5l4.5 4.5M14.5 9.5c-3 3-6 2-8 4.5a3 3 0 1 0 4 4c1.2-1.4.6-3.4-1-3.6"
          />
        </g>
        <g
          class="ic-brake"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        >
          <path d="M6 8h12M6 12h12M8 16l4 3 4-3" />
        </g>
        <g
          class="ic-climb"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20V6M6 11l6-6 6 6" />
        </g>
      </svg>
      <span class="lbl">JUMP</span>
    </button>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
